# Open Smart Home – local Smart Home Gateway
#
# Core (always): Home Assistant + Mosquitto MQTT broker.
# Optional, enabled with profiles (only start what you have hardware for):
#   zigbee  – Zigbee2MQTT            (needs a Zigbee coordinator USB adapter)
#   zwave   – Z-Wave JS UI           (needs a Z-Wave USB controller)
#   matter  – Python Matter Server
#   thread  – OpenThread Border Router (needs an RCP radio; see docs)
#   esphome – ESPHome dashboard
#
#   cp .env.example .env   # then edit every "change-me" value
#   docker compose up -d                                  # core only
#   docker compose --profile zigbee --profile matter up -d
#
# Full guide: ../docs/GATEWAY.md

name: smarthome

services:
  homeassistant:
    image: ${HA_IMAGE:-ghcr.io/home-assistant/home-assistant:stable}
    container_name: homeassistant
    restart: unless-stopped
    # Host networking is required for device discovery (mDNS/SSDP),
    # Matter/Thread (IPv6 multicast) and for the app's local connection.
    network_mode: host
    environment:
      TZ: ${TZ}
    volumes:
      - homeassistant_config:/config
      - /etc/localtime:/etc/localtime:ro
      - /run/dbus:/run/dbus:ro # Bluetooth integration (optional)
    healthcheck:
      # /manifest.json is served by the frontend without authentication.
      test: ['CMD', 'curl', '-fsS', '-o', '/dev/null', 'http://127.0.0.1:8123/manifest.json']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    depends_on:
      mosquitto:
        condition: service_healthy

  mosquitto:
    image: ${MOSQUITTO_IMAGE:-eclipse-mosquitto:2}
    container_name: mosquitto
    restart: unless-stopped
    ports:
      - '${MQTT_BIND:-0.0.0.0}:1883:1883'
    environment:
      MQTT_HA_USER: ${MQTT_HA_USER}
      MQTT_HA_PASSWORD: ${MQTT_HA_PASSWORD}
      MQTT_Z2M_USER: ${MQTT_Z2M_USER}
      MQTT_Z2M_PASSWORD: ${MQTT_Z2M_PASSWORD}
    # The password file is (re)generated from .env at every start, so
    # passwords never live in the repository and rotate with a restart.
    entrypoint: ['/bin/sh', '/scripts/mosquitto-start.sh']
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./scripts/mosquitto-start.sh:/scripts/mosquitto-start.sh:ro
      - mosquitto_data:/mosquitto/data
    healthcheck:
      test:
        - CMD-SHELL
        - mosquitto_sub -h 127.0.0.1 -p 1883 -u "$$MQTT_HA_USER" -P "$$MQTT_HA_PASSWORD" -t '$$SYS/broker/uptime' -C 1 -W 5
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  zigbee2mqtt:
    profiles: [zigbee]
    image: ${Z2M_IMAGE:-koenkk/zigbee2mqtt:latest}
    container_name: zigbee2mqtt
    restart: unless-stopped
    ports:
      - '${Z2M_FRONTEND_BIND:-0.0.0.0}:8080:8080'
    environment:
      TZ: ${TZ}
      # Values in ZIGBEE2MQTT_CONFIG_* override configuration.yaml.
      ZIGBEE2MQTT_CONFIG_HOMEASSISTANT_ENABLED: 'true'
      ZIGBEE2MQTT_CONFIG_MQTT_SERVER: mqtt://mosquitto:1883
      ZIGBEE2MQTT_CONFIG_MQTT_USER: ${MQTT_Z2M_USER}
      ZIGBEE2MQTT_CONFIG_MQTT_PASSWORD: ${MQTT_Z2M_PASSWORD}
      ZIGBEE2MQTT_CONFIG_SERIAL_PORT: /dev/zigbee
      ZIGBEE2MQTT_CONFIG_SERIAL_ADAPTER: ${ZIGBEE_ADAPTER_TYPE}
      ZIGBEE2MQTT_CONFIG_FRONTEND_ENABLED: 'true'
      ZIGBEE2MQTT_CONFIG_FRONTEND_PORT: '8080'
    devices:
      # Stable host path (/dev/serial/by-id/...) mapped to a fixed name.
      - ${ZIGBEE_ADAPTER_PATH}:/dev/zigbee
    group_add:
      - dialout
    volumes:
      - zigbee2mqtt_data:/app/data
      - /run/udev:/run/udev:ro
    depends_on:
      mosquitto:
        condition: service_healthy

  zwave-js-ui:
    profiles: [zwave]
    image: ${ZWAVE_IMAGE:-zwavejs/zwave-js-ui:latest}
    container_name: zwave-js-ui
    restart: unless-stopped
    tty: true
    stop_signal: SIGINT
    ports:
      - '${ZWAVE_UI_BIND:-0.0.0.0}:8091:8091' # web UI
      - '127.0.0.1:3000:3000' # Z-Wave JS WebSocket server for Home Assistant (host-only)
    environment:
      TZ: ${TZ}
      SESSION_SECRET: ${ZWAVE_SESSION_SECRET}
    devices:
      - ${ZWAVE_ADAPTER_PATH}:/dev/zwave
    volumes:
      - zwave_js_store:/usr/src/app/store

  matter-server:
    profiles: [matter]
    image: ${MATTER_IMAGE:-ghcr.io/home-assistant-libs/python-matter-server:stable}
    container_name: matter-server
    restart: unless-stopped
    # Matter needs host networking and IPv6 (mDNS, link-local multicast).
    network_mode: host
    security_opt:
      - apparmor=unconfined
    command: ['--storage-path', '/data', '--paa-root-cert-dir', '/data/credentials']
    volumes:
      - matter_data:/data

  otbr:
    profiles: [thread]
    image: ${OTBR_IMAGE:-openthread/otbr:latest}
    container_name: otbr
    restart: unless-stopped
    # OTBR manages network interfaces and routing on the host.
    network_mode: host
    privileged: true
    command: ['--radio-url', 'spinel+hdlc+uart:///dev/thread-rcp?uart-baudrate=${THREAD_RCP_BAUDRATE:-460800}']
    devices:
      - ${THREAD_RCP_PATH}:/dev/thread-rcp
    volumes:
      - otbr_data:/var/lib/thread

  esphome:
    profiles: [esphome]
    image: ${ESPHOME_IMAGE:-ghcr.io/esphome/esphome:stable}
    container_name: esphome
    restart: unless-stopped
    network_mode: host # discovery of devices via mDNS
    environment:
      TZ: ${TZ}
      USERNAME: ${ESPHOME_USERNAME}
      PASSWORD: ${ESPHOME_PASSWORD}
    volumes:
      - esphome_config:/config

volumes:
  homeassistant_config:
  mosquitto_data:
  zigbee2mqtt_data:
  zwave_js_store:
  matter_data:
  otbr_data:
  esphome_config:
