# Mosquitto 2.x – authenticated broker for the Smart Home Gateway.
# The password file is generated at start-up from .env
# (see scripts/mosquitto-start.sh); anonymous access is disabled.

persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type error
log_type warning
log_type notice

listener 1883
allow_anonymous false
password_file /mosquitto/data/passwd
